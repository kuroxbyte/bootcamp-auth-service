# Configuración de las pruebas: no se consulta config-server.
spring:
  application:
    name: auth-service
  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false
  mongodb:
    uri: mongodb://localhost:27017/auth_test_db
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # Las pruebas no se conectan a un broker; el consumidor se prueba directamente.
      auto-startup: false

eureka:
  client:
    # Las pruebas no se registran en Eureka.
    enabled: false

messaging:
  topics:
    customer-events: customer-events

cache:
  customers:
    ttl: 10m

# Claves RSA solo para las pruebas (distintas de las de config-repo).
jwt:
  issuer: bank-auth-service
  expiration: 1h
  private-key: 
  public-key: 
